spring:
  application:
    name: sio-backend

  profiles:
    active:
      - dev

  datasource:
    # URL di connessione (di default PostgreSQL su docker espone la 5434)
    url: jdbc:postgresql://localhost:5434/sio_db
    username: sio_user
    password: sio_password
    driver-class-name: org.postgresql.Driver

  jpa:
    # Mostra le query SQL in console (utilissimo per la didattica!)
    show-sql: true
    hibernate:
      # 'none' perché le tabelle sono già create dal file init.sql
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

# Configurazione porta del backend
server:
  port: 3000

# Configurazione della documentazione interattiva OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# Actuator: espone i dettagli di health (db, diskSpace, ping, ...) e consente
# al frontend su localhost:4200 di leggerli.
management:
  endpoint:
    health:
      show-details: always

  endpoints:
    web:
      cors:
        allowed-origins:
          - http://localhost:4200
        allowed-methods:
          - GET

logging:
  level:
    root: INFO